name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/ecs-project:$IMAGE_TAG -t $ECR_REGISTRY/ecs-project:latest .
          docker push $ECR_REGISTRY/ecs-project:$IMAGE_TAG
          docker push $ECR_REGISTRY/ecs-project:latest

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@68b488a75bdf7fe1ef4c104a8b33221b42c3bf9c  # chore(deps): Update trivy to v0.71.0 (#571)
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/ecs-project:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Update ECS task definition and deploy
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PREVIOUS_TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ecs-project-cluster \
            --services ecs_project_service \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "previous_task_def=$PREVIOUS_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ecs-project-task \
            --query taskDefinition \
            --output json)

          NEW_IMAGE="$ECR_REGISTRY/ecs-project:$IMAGE_TAG"

          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .placementConstraints, .compatibilities, .registeredAt, .registeredBy)')

          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --cluster ecs-project-cluster \
            --service ecs_project_service \
            --task-definition $NEW_REVISION \
            --force-new-deployment

      - name: Wait for deployment to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ecs-project-cluster \
            --services ecs_project_service

      - name: Health check
        run: |
          curl --fail https://ecs.jabz.uk/health

      - name: Roll back on failure
        if: failure()
        run: |
          aws ecs update-service \
            --cluster ecs-project-cluster \
            --service ecs_project_service \
            --task-definition ${{ steps.deploy.outputs.previous_task_def }} \
            --force-new-deployment
